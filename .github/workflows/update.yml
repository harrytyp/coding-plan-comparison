name: Update coding-plan data

# Deterministischer täglicher Update-Lauf:
# 1. fetch alle Quellen (Snapshots + Manifest + Change-Detection)
# 2. parse → strukturierte Daten
# 3. build → public/data/latest.json
# 4. Tests
# 5. Commit bei Änderung + Deploy auf GitHub Pages
# Bei Änderungen an JS-SPA-Quellen (Preise nicht scrapebar) → Review-Issue für manuelle overrides.yml-Pflege.

on:
  schedule:
    - cron: "17 3 * * *"   # täglich 03:17 UTC
  workflow_dispatch:        # manuell triggerbar
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch alle Quellen
        run: node scripts/fetch.mjs
        continue-on-error: false

      - name: Parse Snapshots
        run: node scripts/parse-all.mjs

      - name: Build latest.json
        run: node scripts/build.mjs

      - name: Tests
        run: npm test

      - name: Change-Detection
        id: check
        run: node scripts/check.mjs || true   # exit 2 = geändert, aber wir committen trotzdem

      - name: Commit bei Änderung
        run: |
          git config user.name "coding-plan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/latest.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen — nichts zu committen"
          else
            git commit -m "chore(data): update coding-plan snapshots $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Review-Issue bei geänderten SPA-Quellen (Preise manuell prüfen)
        if: steps.check.outcome == 'success'
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("cache/manifest.json","utf8"));
            const changed = Object.values(m.sources).filter(s => s.changed);
            const spa = changed.filter(s => ["glm-pricing-page","minimax-token-plan"].includes(s.id));
            if (spa.length) {
              const body = "SPA-Quellen geändert — Preise bitte manuell in data/overrides.yml prüfen:\n" + spa.map(s=>`- ${s.id} (${s.url})`).join("\n");
              require("child_process").execSync(`gh issue create --title "SPA-Preise geändert — overrides prüfen" --body "${body}"`, {stdio:"inherit"});
            }
          '

      # Website-Dateien für Legacy-Pages (Source: main/) in die Wurzel spiegeln
      - name: Website-Dateien in Root spiegeln
        run: |
          cp public/index.html ./index.html
          cp public/app.js ./app.js
          mkdir -p data
          cp public/data/latest.json data/latest.json
          touch .nojekyll
          git add index.html app.js data/latest.json .nojekyll
          if git diff --cached --quiet; then
            echo "Website unverändert"
          else
            git commit -m "chore(web): sync website files to root for legacy Pages $(date -u +%Y-%m-%d)"
            git push
          fi
