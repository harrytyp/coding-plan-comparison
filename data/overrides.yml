    noteDe: "Das Fünffache der Plus-Bereiche laut OpenAI: GPT-6 Astra 25-225, GPT-6 Sol 70-700, GPT-6 Luna 1.750-14.000, GPT-5.6 Sol 50-500, GPT-5.6 Terra 125-1.000, GPT-5.6 Luna 1.250-10.000. Quelle: developers.openai.com/codex/pricing"

