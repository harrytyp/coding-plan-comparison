    noteDe: "Cursor nennt zwei Monats-Pools (Cursor Models: Grok/Composer; Other Models zu Anbieterpreisen), aber nicht die enthaltene Menge. Drittseitige Angabe (rankllms.com/coding-plans, geprüft 2026-09-13): etwa 20 $ Nutzungsguthaben, darüber API-Preis plus 20 Prozent. Quelle: cursor.com/pricing und cursor.com/help/models-and-usage/usage-limits"

