  # ---------------------------------------------------------------------------

  # OpenAI Codex / ChatGPT: offizielle Tabelle "local messages per five-hour period"
  # je Modell und Tarif. 5h-Fenster = Durchsatz-Cap, deshalb keine Monatsrate.
  # Quelle: developers.openai.com/codex/pricing (gelesen 2026-09-23)
  - id: chatgpt-plus-codex
    provider: openai
    name: ChatGPT Plus (Codex)
    price: { monthlyUsd: 20, paidPrice: 20, advertisedPrice: 20, currency: USD }
    meter: messages
    disclosure: reference
    dataTierNote: "Official 5h message estimates per model from developers.openai.com/codex/pricing (read 2026-09-23)"
    quotas:
      - { label: "5h", unit: messages, amount: 150, min: 15, max: 150, window: "5h", refresh: rolling, disclosure: "official estimate" }
    lastVerified: 2026-09-23
    note: "OpenAI publishes local messages per five-hour period as ranges, not fixed limits. GPT-6 Astra 5-45, GPT-6 Sol 15-150, GPT-6 Luna 350-3,000, GPT-5.6 Sol 10-100, GPT-5.6 Terra 25-200, GPT-5.6 Luna 250-2,000, GPT-5.4 20-100, GPT-5.4 mini 60-350. Local messages and cloud chats share the allowance, weekly limits may also apply. Source: developers.openai.com/codex/pricing"
    noteDe: "OpenAI veröffentlicht lokale Nachrichten pro Fünf-Stunden-Fenster als Bereiche, nicht als feste Limits. GPT-6 Astra 5-45, GPT-6 Sol 15-150, GPT-6 Luna 350-3.000, GPT-5.6 Sol 10-100, GPT-5.6 Terra 25-200, GPT-5.6 Luna 250-2.000, GPT-5.4 20-100, GPT-5.4 mini 60-350. Lokale Nachrichten und Cloud-Chats teilen sich das Kontingent, zusätzlich können Wochenlimits gelten. Quelle: developers.openai.com/codex/pricing"

  - id: chatgpt-pro-codex-5x
