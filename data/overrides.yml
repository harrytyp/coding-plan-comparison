# Overrides, nur für Daten, die NICHT scrapebar sind (JS-SPA, Auth-APIs, undisclosed).
# Alles Scrapebare kommt dynamisch aus sources.yml → cache/ → parsed/.
# Diese Datei ist die manuelle Ergänzung; ein Cron-Agent prüft die Quellen und aktualisiert hier.

overrides:
  # GLM Preise: nur über JS/API (Auth nötig), daher manuell gepflegt.
  # Quelle: open.bigmodel.cn/glm-coding (SPA); Quoten+Formel kommen dynamisch aus glm-coding-overview.
  - id: glm-lite
    price: { monthlyUsd: 16.5, paidPrice: 16.5, advertisedPrice: 16.5, currency: CNY, monthlyCny: 118, billingNote: "¥118/月 连续包月; 包季 8折 ¥94.4, 包年 7折 ¥82.6" }
    lastVerified: 2026-08-28
  - id: glm-pro
    price: { monthlyUsd: 75, paidPrice: 75, advertisedPrice: 75, currency: CNY, monthlyCny: 538, billingNote: "¥538/月 连续包月; 包季 8折 ¥430.4, 包年 7折 ¥376.6" }
    lastVerified: 2026-08-28
  - id: glm-max
    price: { monthlyUsd: 151, paidPrice: 151, advertisedPrice: 151, currency: CNY, monthlyCny: 1078, billingNote: "¥1078/月 连续包月; 包季 8折 ¥862.4, 包年 7折 ¥754.6" }
    lastVerified: 2026-08-28

  # MiniMax Token Plan: JS-SPA, Preise/Quoten nicht direkt scrapebar (bisher).
  # Werte aus coding-plans-Tabelle (Rohdaten, zu verifizieren).
  - id: minimax-starter
    provider: minimax
    name: MiniMax Token Plan
    price: { monthlyUsd: 10, paidPrice: 10, advertisedPrice: 10 }
    quota: { label: "5h", unit: prompts, amount: 100, window: "5h", refresh: rolling, disclosure: exact }
    feedModels: ["MiniMax M3", "MiniMax M2.7", "MiniMax M2.5"]
    meter: prompts
    lastVerified: 2026-08-28
    note: "Aus coding-plans-Tabelle; MiniMax-SPA nicht direkt parsebar. Prompts = 100/5h; Modellkosten aus Feed."

  # Command Code Go (1 $): laut Doku der einzige Command-Code-Plan OHNE API-Zugang.
  # Quelle: commandcode.ai/docs/plans/go ("Go is the only plan without API access"),
  # geprueft 2026-09-13. Darum ist der Plan an die Command-Code-CLI gebunden.
  - id: command-code-go
    tag: "CLI only"
    tagDe: "nur CLI"
    note: "No API access: the $1 Go credits can only be spent in the Command Code CLI, so this plan cannot be used from your own harness or agent. Every other Command Code plan includes API access."
    noteDe: "Kein API-Zugang: Die Credits des 1-$-Plans lassen sich nur in der Command-Code-CLI ausgeben, der Plan ist damit nicht in einem eigenen Harness oder Agenten nutzbar. Alle anderen Command-Code-Pläne haben API-Zugang."
