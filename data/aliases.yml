# Model-Alias-Mapping: Feed-Modellname → LLM Stats Score-Slug
# Wird in build.mjs geladen. Ein Modell kann mehrere Aliase haben.
# Erweitern bei neuen Modellen.
aliases:
  # Feed nennt es "Tencent Hy3" → LLM Stats hat "hy3"
  tencent-hy3: hy3
  hy3: hy3

  # Feed nennt es "Tencent Hy4 Preview" → LLM Stats hat "hy4-preview"
  tencent-hy4-preview: hy4-preview
  hy4-preview: hy4-preview

  # Feed nennt es "Step 3.7 Flash" → LLM Stats hat "step-3.5-flash"
  step-3-7-flash: step-3-5-flash
  step-3-5-flash: step-3-5-flash

  # Feed nennt es "Qwen 3.8 Max 0902" → LLM Stats hat "qwen3.8-max"
  qwen-3-8-max-0902: qwen3-8-max
  qwen3-8-max: qwen3-8-max

  # Feed nennt es "Qwen 3.6 Max Preview" → LLM Stats hat "qwen3.6-plus"
  qwen-3-6-max-preview: qwen3-6-plus
  qwen3-6-plus: qwen3-6-plus

  # Feed nennt es "Qwen 3.7 Flash" → LLM Stats hat "qwen3.7-max" (nächste verfügbare)
  qwen-3-7-flash: qwen3-7-max
  qwen3-7-max: qwen3-7-max

  # Feed nennt es "LongCat-2.0" → LLM Stats hat "longcat-flash-thinking-2601"
  longcat-2-0: longcat-flash-thinking-2601
  longcat-flash-thinking-2601: longcat-flash-thinking-2601

  # Feed nennt es "Fugu Ultra" → nicht in LLM Stats, kein Alias

  # Feed nennt es "DeepSeek V4 Flash" → LLM Stats hat mehrere Versionen
  deepseek-v4-flash: deepseek-v4-flash-0423
  deepseek-v4-flash-0423: deepseek-v4-flash-0423